[pytest]
pythonpath = .
testpaths = tests
addopts =
    -q
    --cov=api.auth_routes
    --cov=api.compatibility_routes
    --cov=api.explain_routes
    --cov=api.lifestyle_routes
    --cov=api.medication_routes
    --cov=api.prediction_routes
    --cov=api.risk_routes
    --cov=api.what_if_routes
    --cov=services.risk.prediction_service
    --cov-branch
    --cov-report=term-missing
    --cov-report=html:coverage_html
    --cov-report=xml:coverage.xml
    --cov-fail-under=80
